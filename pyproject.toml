[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandao-delivery-pack"
version = "0.1.0"
description = "Build complete handover packages from files and a delivery recipe"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PANDAO"}]
dependencies = []

[project.scripts]
pandao-delivery = "pandao_delivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
